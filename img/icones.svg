<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    Ícones do site (sprite SVG).
    Uso no HTML:  <svg class="icone"><use href="img/icones.svg#instagram"></use></svg>
    A cor segue a cor do texto (currentColor).
  -->

  <!-- Redes e contato -->
  <symbol id="instagram" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="5" />
      <circle cx="12" cy="12" r="4" />
    </g>
    <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" />
  </symbol>

  <symbol id="facebook" viewBox="0 0 24 24">
    <path fill="currentColor" d="M13.5 21v-7.5h2.5l.4-3h-2.9V8.6c0-.9.3-1.5 1.5-1.5h1.5V4.4a20 20 0 0 0-2.2-.1c-2.2 0-3.7 1.3-3.7 3.8v2.4H8v3h2.6V21z" />
  </symbol>

  <symbol id="whatsapp" viewBox="0 0 24 24">
    <path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4a.5.5 0 0 0 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 2.9 2.9 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.6 11.6 0 0 0 4.4 3.9c1.6.7 2.3.8 3.1.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.1-.2-.2-.5-.3z" />
  </symbol>

  <symbol id="local" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z" />
      <circle cx="12" cy="10" r="2.5" />
    </g>
  </symbol>

  <symbol id="relogio" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="9" />
      <path d="M12 7v5l3 2" />
    </g>
  </symbol>

  <symbol id="email" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="5" width="18" height="14" rx="2" />
      <path d="M3 7l9 6 9-6" />
    </g>
  </symbol>

  <symbol id="rota" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M3 11l18-8-8 18-2-8z" />
  </symbol>

  <!-- Transporte pet -->
  <symbol id="floco" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2v20M4.9 6l14.2 12M4.9 18L19.1 6M9 3.5l3 2.5 3-2.5M9 20.5l3-2.5 3 2.5" />
  </symbol>

  <symbol id="folha" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 21c0-9 5-15 15-16-1 10-7 15-15 16zM5 21l8-8" />
  </symbol>

  <symbol id="patinha" viewBox="0 0 32 32">
    <g fill="currentColor">
      <ellipse cx="9" cy="11" rx="3.2" ry="4.2" />
      <ellipse cx="23" cy="11" rx="3.2" ry="4.2" />
      <ellipse cx="4.6" cy="18" rx="2.8" ry="3.5" />
      <ellipse cx="27.4" cy="18" rx="2.8" ry="3.5" />
      <path d="M16 15c-5 0-9.5 6.8-9.5 10.3C6.5 28 8.8 29 11 29c2 0 3.2-1 5-1s3 1 5 1c2.2 0 4.5-1 4.5-3.7C25.5 21.8 21 15 16 15z" />
    </g>
  </symbol>

  <!-- Procedimentos do hospital -->
  <symbol id="estetoscopio" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 3v5a5 5 0 0 0 10 0V3" /><path d="M10 13v2a5 5 0 0 0 10 0v-2" /><circle cx="20" cy="11" r="2" />
    </g>
  </symbol>

  <symbol id="bisturi" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 4 9 15l-3 1 1-3L18 2z" /><path d="M6 16 3 21" />
    </g>
  </symbol>

  <symbol id="estrela" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 3l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.3l6-.8z" />
  </symbol>

  <symbol id="frasco" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3" /><path d="M7.5 15h9" />
    </g>
  </symbol>

  <symbol id="pulso" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 12h4l2-5 4 10 2-5h6" />
  </symbol>

  <symbol id="lupa" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="6" /><path d="m20 20-4.5-4.5" />
    </g>
  </symbol>
</svg>
